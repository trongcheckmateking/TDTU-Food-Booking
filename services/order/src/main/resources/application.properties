# Order Service (Spring Boot). Cổng, địa chỉ DB lấy từ .env ở thư mục gốc dự án (xem OrderserviceApplication).
spring.application.name=order-service
spring.main.banner-mode=off

# H2 lưu ra tệp DATA_DIR/order.mv.db (URL được đặt lúc khởi động)
spring.datasource.url=jdbc:h2:mem:order-dev
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false

# Bảng tạo bằng schema.sql (CREATE TABLE IF NOT EXISTS), truy cập qua JdbcTemplate
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

server.error.include-message=never
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false
spring.jackson.default-property-inclusion=always
server.shutdown=graceful

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
